<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print Table Cards</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/print.css">
</head>
<body>
  <div class="ptools no-print">
    <a class="btn btn-sm btn-ghost" href="/admin#tables">← Back</a>
    <div class="seg" role="radiogroup" aria-label="Card style">
      <button role="radio" data-style="standee">Standee A6</button>
      <button role="radio" data-style="tent">Table tent</button>
      <button role="radio" data-style="card">Card grid</button>
    </div>
    <label class="check"><input type="checkbox" id="view3d" checked> 3D preview</label>
    <button class="btn btn-sm btn-primary" onclick="window.print()">🖨 Print</button>
  </div>
  <p class="no-print ptip muted">Tip: in the print dialog choose <b>A4</b>, margins <b>None</b>, and enable <b>Background graphics</b>.</p>
  <main id="sheets" class="sheets"></main>
  <script type="module" src="/js/print.js"></script>
</body>
</html>
