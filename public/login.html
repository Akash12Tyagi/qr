<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14110F">
  <meta name="robots" content="noindex">
  <title>Sign in · Kitchen Console</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/poppins-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <main class="login">
    <form class="login-card signin" id="loginForm" novalidate>
      <div class="logo-3d" aria-hidden="true"><span>🔥</span></div>
      <h1 class="display">Sign in</h1>
      <p class="muted">Restaurant owners and staff: manage orders, bills, menu and QR codes.</p>
      <label class="field"><span>Email</span><input class="input" id="email" name="email" type="email" autocomplete="username" required maxlength="120" autofocus></label>
      <label class="field"><span>Password</span><input class="input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
      <p class="form-err hidden" id="err" role="alert"></p>
      <button class="btn btn-primary" type="submit" id="submit">Sign in</button>
      <p class="hint muted">Forgot your password? Ask your restaurant owner (staff) or your platform provider (owners) for a reset.</p>
    </form>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
