<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0b09">
  <title>Menu</title>
  <meta name="description" content="Browse the menu and order from your table — no app needed.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/menu.css">
  <script>try{var t=localStorage.getItem('qm:theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
  <script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.min.js" } }</script>
</head>
<body>
  <div class="embers" aria-hidden="true"></div>

  <header class="hero" id="top">
    <div class="hero-top">
      <span class="table-badge" id="tableBadge"><span class="dot"></span><span id="tableText">Browsing</span></span>
      <div class="hero-actions">
        <button class="btn btn-icon btn-sm btn-ghost hidden" id="ordersBtn" aria-label="My orders">🧾<span class="pip" id="ordersPip"></span></button>
        <button class="btn btn-icon btn-sm btn-ghost" id="themeBtn" aria-label="Toggle light / dark theme">🌓</button>
      </div>
    </div>
    <h1 class="display brand" id="brandName"><span class="skeleton" style="display:inline-block;width:240px;height:40px"></span></h1>
    <p class="tagline" id="tagline">&nbsp;</p>
    <div class="info-row" id="infoRow"></div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="search-row">
      <label class="search">
        <span aria-hidden="true">🔍</span>
        <input id="search" type="search" placeholder="Search dishes, ingredients…" autocomplete="off" enterkeyhint="search">
      </label>
      <button class="filter" data-filter="veg" aria-pressed="false"><i class="diet"></i>Veg</button>
      <button class="filter" data-filter="popular" aria-pressed="false">⭐ Popular</button>
      <button class="filter" data-filter="mild" aria-pressed="false">🌿 Mild</button>
    </div>
    <nav class="cats" id="cats" aria-label="Menu categories"></nav>
  </div>

  <main id="main" class="wrap">
    <section class="picks" id="picksSec">
      <h2 class="sec-title display">Chef’s picks <span class="muted">swipe →</span></h2>
      <div class="picks-track" id="picks"></div>
    </section>
    <div id="sections"></div>
    <div id="empty" class="empty hidden">
      <div class="big">🍽️</div>
      <p>No dishes match that. Try another search or filter.</p>
      <button class="btn btn-sm" id="clearFilters">Clear filters</button>
    </div>
    <footer class="foot muted">
      Prices include all ingredients · <span id="taxNote"></span><br>
      Powered by <strong>QR Menu</strong> — no app, just scan &amp; order.
    </footer>
  </main>

  <!-- Call waiter -->
  <div class="fab-wrap" id="fabWrap">
    <div class="fab-menu" id="fabMenu" role="menu">
      <button role="menuitem" data-call="waiter">🙋 Call waiter</button>
      <button role="menuitem" data-call="water">💧 Water please</button>
      <button role="menuitem" data-call="cutlery">🍴 Cutlery</button>
      <button role="menuitem" data-call="bill">🧾 Get the bill</button>
    </div>
    <button class="fab" id="fab" aria-haspopup="menu" aria-expanded="false" aria-label="Call staff">🛎️</button>
  </div>

  <!-- Cart bar -->
  <button class="cartbar" id="cartbar" aria-label="View cart">
    <span class="cb-count" id="cbCount">0</span>
    <span class="cb-text"><strong id="cbTotal">₹0</strong><small id="cbItems">0 items</small></span>
    <span class="cb-cta">View cart →</span>
  </button>

  <!-- Sheets -->
  <div class="scrim" id="scrim"></div>

  <section class="sheet" id="itemSheet" role="dialog" aria-modal="true" aria-labelledby="isName">
    <button class="sheet-close" data-close aria-label="Close">✕</button>
    <div class="is-stage" id="isStage"></div>
    <div class="sheet-body">
      <div class="is-head">
        <h2 class="display" id="isName"></h2>
        <div class="is-price" id="isPrice"></div>
      </div>
      <div class="is-meta" id="isMeta"></div>
      <p class="is-desc" id="isDesc"></p>
      <label class="field"><span>Special request</span>
        <input class="input" id="isNote" maxlength="120" placeholder="e.g. less spicy, no onions">
      </label>
    </div>
    <div class="sheet-foot">
      <div class="stepper" id="isStepper">
        <button data-step="-1" aria-label="Decrease">−</button><output id="isQty">1</output><button data-step="1" aria-label="Increase">+</button>
      </div>
      <button class="btn btn-primary grow" id="isAdd">Add to order</button>
    </div>
  </section>

  <section class="sheet" id="cartSheet" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
    <button class="sheet-close" data-close aria-label="Close">✕</button>
    <div class="sheet-body">
      <h2 class="display" id="cartTitle">Your order</h2>
      <p class="muted" id="cartTable"></p>
      <ul class="cart-lines" id="cartLines"></ul>
      <div class="cart-extra">
        <label class="field"><span>Your name (optional)</span><input class="input" id="custName" maxlength="40" autocomplete="given-name" placeholder="So we can call you"></label>
        <label class="field"><span>Note for the kitchen</span><textarea class="input" id="orderNote" maxlength="200" rows="2" placeholder="Allergies, timing, celebrations 🎂"></textarea></label>
        <label class="field hidden" id="tablePickWrap"><span>Your table</span><select class="input" id="tablePick"></select></label>
      </div>
      <dl class="bill" id="bill"></dl>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-primary grow" id="placeBtn">Place order</button>
    </div>
  </section>

  <section class="sheet" id="trackSheet" role="dialog" aria-modal="true" aria-labelledby="trackTitle">
    <button class="sheet-close" data-close aria-label="Close">✕</button>
    <div class="sheet-body" id="trackBody"></div>
  </section>

  <noscript><p style="padding:24px">Please enable JavaScript to view the menu.</p></noscript>
  <script type="module" src="/js/menu.js"></script>
</body>
</html>
